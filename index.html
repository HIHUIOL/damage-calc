<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>属贯伤害计算器</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1a1a1a;
    color: #e0e0e0;
    margin: 0;
    padding: 16px;
    line-height: 1.5;
  }
  h1 { font-size: 1.3em; margin: 0 0 16px; color: #ffcc66; }
  .card {
    background: #262626;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .card h2 {
    font-size: 0.95em;
    margin: 0 0 10px;
    color: #88ccff;
    font-weight: 600;
  }
  .hint {
    font-size: 0.78em;
    color: #888;
    margin-bottom: 10px;
    line-height: 1.6;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }
  .row label { flex: 1; font-size: 0.9em; color: #bbb; }
  .row input, .row select {
    width: 130px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #1a1a1a;
    color: #fff;
    font-size: 0.9em;
    text-align: right;
  }
  .row select { text-align: left; }
  .row input:focus, .row select:focus { outline: none; border-color: #ffcc66; }

  .resist-summary {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #333;
    font-size: 0.85em;
  }
  .resist-summary .item { color: #999; }
  .resist-summary .item b { color: #ffcc66; }

  .result-main {
    background: #2a2a1a;
    border: 1px solid #ffcc66;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    margin-top: 16px;
  }
  .result-main .label { font-size: 0.85em; color: #999; }
  .result-main .big {
    font-size: 2.2em;
    font-weight: 700;
    color: #ffcc66;
    margin: 4px 0;
  }
  .result-sub {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .result-sub .box {
    flex: 1;
    background: #262626;
    border-radius: 8px;
    padding: 10px 6px;
    text-align: center;
  }
  .result-sub .box .label { font-size: 0.75em; color: #888; }
  .result-sub .box .val { font-size: 1.1em; font-weight: 600; margin-top: 4px; }
  .box.normal .val { color: #88ccff; }
  .box.crit .val { color: #ffaa66; }
  .box.neg .val { color: #ff6666; }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .btn-row button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: #e0e0e0;
    font-size: 0.9em;
    cursor: pointer;
  }
  .btn-row button:hover { border-color: #ffcc66; }
  .btn-row button.danger { color: #ff8888; }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #ffcc66;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.9em;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<h1>属贯伤害计算器</h1>

<div class="card">
  <h2>物理部分</h2>
  <div class="row"><label>物理面板</label><input id="physPanel" type="number" value="736"></div>
  <div class="row"><label>超会心</label><select id="skill_超会心"></select></div>
  <div class="row"><label>物理吸收（1=100%）</label><input id="physAbsorb" type="number" step="0.01" value="1"></div>
  <div class="row"><label>会心率（%，-100~100）</label><input id="critRate" type="number" step="1" value="100" min="-100" max="100"></div>
</div>

<div class="card">
  <h2>属性基础</h2>
  <div class="row"><label>属性攻击力强化</label><select id="skill_属性攻击力强化"></select></div>
  <div class="row"><label>奋斗</label><select id="skill_奋斗"></select></div>
  <div class="row"><label>钢壳/炎鳞</label><select id="skill_钢壳炎鳞"></select></div>
</div>

<div class="card">
  <h2>属性固定加点</h2>
  <div class="hint">
    连击提示：连击数 ≥5 才触发最大效果，2 秒内没增加连击数效果就会消失。<br>
    连击会加面板攻击力，请在触发最大效果时的 2 秒内，看状态里的攻击力面板，把这个面板填到上面的「物理面板」里。
  </div>
  <div class="row"><label>连击</label><select id="skill_连击"></select></div>
  <div class="row"><label>伏魔耗命</label><select id="skill_伏魔耗命"></select></div>
  <div class="row"><label>其他（直接填数值）</label><input id="otherFlat" type="number" step="0.01" value="0"></div>
</div>

<div class="card">
  <h2>耐性相关</h2>
  <div class="hint">
    提示：到修炼场切到蓝书，输入「显示」的耐性。<br>
    每项耐性上限 50，可填负数。
  </div>
  <div class="row"><label>火耐性</label><input id="resFire" type="number" step="1" value="0"></div>
  <div class="row"><label>水耐性</label><input id="resWater" type="number" step="1" value="20"></div>
  <div class="row"><label>雷耐性</label><input id="resThunder" type="number" step="1" value="7"></div>
  <div class="row"><label>冰耐性</label><input id="resIce" type="number" step="1" value="17"></div>
  <div class="row"><label>龙耐性</label><input id="resDragon" type="number" step="1" value="-10"></div>

  <div class="row"><label>业铠</label><select id="skill_业铠"></select></div>
  <div class="row"><label>激昂</label><select id="skill_激昂"></select></div>
  <div class="row"><label>龙气转换</label><select id="skill_龙气转换"></select></div>

  <div class="resist-summary">
    <div class="item">真实总耐性：<b id="totalResistDisplay">--</b></div>
    <div class="item">龙转属性值：<b id="dragonFlatDisplay">--</b></div>
  </div>
</div>

<div class="card">
  <h2>属性乘区</h2>
  <div class="row"><label>属痛龙珠</label><select id="skill_属痛龙珠"></select></div>
  <div class="row"><label>弱点特效【属性】</label><select id="skill_弱点特效属性"></select></div>
  <div class="row"><label>会心击【属性】</label><select id="skill_会心击属性"></select></div>
  <div class="row"><label>笛子属性攻击力提升</label><select id="skill_笛子属性攻击力提升"></select></div>
  <div class="row"><label>属性吸收（0.3=30%）</label><input id="elemAbsorb" type="number" step="0.01" value="0.3"></div>
</div>

<div class="result-main">
  <div class="label">期望伤害</div>
  <div class="big" id="expectedDmg">--</div>
</div>

<div class="result-sub">
  <div class="box normal">
    <div class="label">非会心</div>
    <div class="val" id="normalDmg">--</div>
  </div>
  <div class="box crit">
    <div class="label">会心</div>
    <div class="val" id="critDmg">--</div>
  </div>
  <div class="box neg">
    <div class="label">负会心</div>
    <div class="val" id="negDmg">--</div>
  </div>
</div>

<div class="btn-row">
  <button id="btnSave">保存</button>
  <button id="btnLoad">读取</button>
  <button id="btnReset" class="danger">重置</button>
</div>

<div class="card" style="margin-top:12px;">
  <h2>计算公式</h2>
  <div id="formulaBox" style="font-size:0.82em; color:#aaa; line-height:1.8; word-break:break-all;"></div>
</div>

<div class="toast" id="toast"></div>

<script src="skills.js"></script>

<script>
const FIXED = {
  baseElem: 22,
  motion: 10
};

const NEG_CRIT_PHYS = 0.75;

const DEFAULTS = {
  physPanel: 736,
  physAbsorb: 1,
  critRate: 100,
  elemAbsorb: 0.3,
  otherFlat: 0,
  resFire: 0,
  resWater: 20,
  resThunder: 7,
  resIce: 17,
  resDragon: -10,
  skill_超会心: '1',
  skill_属性攻击力强化: '5',
  skill_奋斗: '3b',
  skill_钢壳炎鳞: '2',
  skill_连击: '2',
  skill_伏魔耗命: '2-3',
  skill_业铠: '0',
  skill_激昂: '3',
  skill_龙气转换: '3',
  skill_属痛龙珠: '1',
  skill_弱点特效属性: '3',
  skill_会心击属性: '3',
  skill_笛子属性攻击力提升: '0'
};

const STORAGE_KEY = 'damageCalcData';

function getSkillOption(skillName, key) {
  const skill = SKILLS[skillName];
  if (!skill) return null;
  return skill.options.find(o => o.key === key) || skill.options[0];
}

function initSelects() {
  Object.keys(SKILLS).forEach(skillName => {
    const el = document.getElementById('skill_' + skillName);
    if (!el) return;
    const skill = SKILLS[skillName];
    el.innerHTML = '';
    skill.options.forEach(opt => {
      const option = document.createElement('option');
      option.value = opt.key;
      option.textContent = opt.text;
      el.appendChild(option);
    });
  });
}

function getData() {
  const data = {};
  const ids = ['physPanel', 'physAbsorb', 'critRate', 'elemAbsorb', 'otherFlat',
               'resFire', 'resWater', 'resThunder', 'resIce', 'resDragon'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) data[id] = +el.value;
  });
  Object.keys(SKILLS).forEach(skillName => {
    const el = document.getElementById('skill_' + skillName);
    if (el) data['skill_' + skillName] = el.value;
  });
  return data;
}

function applyData(data) {
  const ids = ['physPanel', 'physAbsorb', 'critRate', 'elemAbsorb', 'otherFlat',
               'resFire', 'resWater', 'resThunder', 'resIce', 'resDragon'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el && data[id] !== undefined) el.value = data[id];
  });
  Object.keys(SKILLS).forEach(skillName => {
    const el = document.getElementById('skill_' + skillName);
    const key = data['skill_' + skillName];
    if (el && key !== undefined) el.value = key;
  });
  calc();
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(getData()));
}

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { return JSON.parse(raw); } catch(e) {}
  }
  return null;
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

function calcResist() {
  const resFire = +document.getElementById('resFire').value || 0;
  const resWater = +document.getElementById('resWater').value || 0;
  const resThunder = +document.getElementById('resThunder').value || 0;
  const resIce = +document.getElementById('resIce').value || 0;
  const resDragon = +document.getElementById('resDragon').value || 0;

  const opt业铠 = getSkillOption('业铠', document.getElementById('skill_业铠').value);
  const opt激昂 = getSkillOption('激昂', document.getElementById('skill_激昂').value);
  const opt龙气 = getSkillOption('龙气转换', document.getElementById('skill_龙气转换').value);

  const bonus = opt业铠.value + opt激昂.value;

  const cap = v => Math.min(v, 50);
  const f = cap(resFire + bonus);
  const w = cap(resWater + bonus);
  const t = cap(resThunder + bonus);
  const i = cap(resIce + bonus);
  const d = cap(resDragon + bonus);

  const total = f + w + t + i + d;

  let dragonFlat = 0;
  if (opt龙气.key === '3') {
    dragonFlat = total / opt龙气.value;
  }

  return { total, dragonFlat, opt龙气, opt业铠, opt激昂, f, w, t, i, d, bonus };
}

function calcOne(mode) {
  const physPanel = +document.getElementById('physPanel').value || 0;
  const physAbsorb = +document.getElementById('physAbsorb').value || 0;
  const elemAbsorb = +document.getElementById('elemAbsorb').value || 0;
  const otherFlat = +document.getElementById('otherFlat').value || 0;

  const opt超会心 = getSkillOption('超会心', document.getElementById('skill_超会心').value);
  const opt属攻 = getSkillOption('属性攻击力强化', document.getElementById('skill_属性攻击力强化').value);
  const opt奋斗 = getSkillOption('奋斗', document.getElementById('skill_奋斗').value);
  const opt钢壳 = getSkillOption('钢壳炎鳞', document.getElementById('skill_钢壳炎鳞').value);
  const opt连击 = getSkillOption('连击', document.getElementById('skill_连击').value);
  const opt伏魔 = getSkillOption('伏魔耗命', document.getElementById('skill_伏魔耗命').value);
  const opt属痛 = getSkillOption('属痛龙珠', document.getElementById('skill_属痛龙珠').value);
  const opt弱特 = getSkillOption('弱点特效属性', document.getElementById('skill_弱点特效属性').value);
  const opt属会 = getSkillOption('会心击属性', document.getElementById('skill_会心击属性').value);
  const opt笛子 = getSkillOption('笛子属性攻击力提升', document.getElementById('skill_笛子属性攻击力提升').value);

  const resist = calcResist();
  const dragonFlat = resist.dragonFlat;

  let 超会心倍率 = 1.0;
  let 属会倍率 = 1.0;

  if (mode === 'normal') {
    超会心倍率 = 1.0;
    属会倍率 = 1.0;
  } else if (mode === 'crit') {
    超会心倍率 = opt超会心.value;
    属会倍率 = opt属会.value;
  } else if (mode === 'neg') {
    超会心倍率 = NEG_CRIT_PHYS;
    属会倍率 = 1.0;
  }

  const physDmg = physPanel * 超会心倍率 * (FIXED.motion / 100) * physAbsorb;

  const elemBase = FIXED.baseElem * opt属攻.value * opt奋斗.value * opt钢壳.value;

  const elemAtkFlat = opt属攻.flat || 0;
  const chainFlat = opt连击.value || 0;
  const fumoFlat = opt伏魔.value || 0;

  const elemTotal = elemBase + elemAtkFlat + chainFlat + fumoFlat + dragonFlat + otherFlat;

  let 属痛倍率 = opt属痛.value;
  if (opt属痛.key === '1' && elemAbsorb * 100 < 25) 属痛倍率 = 1.0;

  let 弱特倍率 = opt弱特.value;
  if (opt弱特.key !== '0' && elemAbsorb * 100 < 20) 弱特倍率 = 1.0;

  const 笛子倍率 = opt笛子.value;

  const elemPercent = elemTotal / 100;
  const elemDmg = elemPercent * 属痛倍率 * 弱特倍率 * 属会倍率 * 笛子倍率 * elemAbsorb * physPanel;

  const total = physDmg + elemDmg;

  return {
    physDmg, elemDmg, total,
    physPanel, physAbsorb, otherFlat,
    opt超会心, opt属攻, opt奋斗, opt钢壳, opt连击, opt伏魔,
    opt属痛, opt弱特, opt属会, opt笛子,
    超会心倍率, 属会倍率,
    elemBase, elemAtkFlat, chainFlat, fumoFlat, dragonFlat, elemTotal,
    属痛倍率, 弱特倍率, 笛子倍率,
    elemAbsorb, resist,
    mode
  };
}

function calc() {
  let critRateRaw = +document.getElementById('critRate').value || 0;
  critRateRaw = Math.max(-100, Math.min(100, critRateRaw));
  document.getElementById('critRate').value = critRateRaw;

  const critRate = critRateRaw / 100;

  const normal = calcOne('normal');
  const crit = calcOne('crit');
  const neg = calcOne('neg');

  let expected;
  if (critRate >= 0) {
    expected = normal.total * (1 - critRate) + crit.total * critRate;
  } else {
    const absRate = Math.abs(critRate);
    expected = normal.total * (1 - absRate) + neg.total * absRate;
  }

  document.getElementById('expectedDmg').textContent = expected.toFixed(2);
  document.getElementById('normalDmg').textContent = normal.total.toFixed(2);
  document.getElementById('critDmg').textContent = crit.total.toFixed(2);
  document.getElementById('negDmg').textContent = neg.total.toFixed(2);

  const r = normal.resist;
  document.getElementById('totalResistDisplay').textContent = r.total;
  document.getElementById('dragonFlatDisplay').textContent = r.dragonFlat.toFixed(3);

  const f = (n, d = 2) => Number(n).toFixed(d);
  const m = normal;
  const r2 = m.resist;

  document.getElementById('formulaBox').innerHTML = `
    <div style="color:#88ccff; margin-bottom:6px;">一、耐性部分</div>
    <div style="font-size:0.9em; color:#777;">每项真实耐性 = 蓝书值 + 业铠 + 激昂，封顶 50</div>
    <div>业铠：${r2.opt业铠.text}（每项 +${r2.opt业铠.value}） ｜ 激昂：${r2.opt激昂.text}（每项 +${r2.opt激昂.value}）</div>
    <div>真实耐性：火 ${r2.f} / 水 ${r2.w} / 雷 ${r2.t} / 冰 ${r2.i} / 龙 ${r2.d}</div>
    <div>真实总耐性 = ${r2.f} + ${r2.w} + ${r2.t} + ${r2.i} + ${r2.d} = <b>${r2.total}</b></div>
    <div>龙气转换：${r2.opt龙气.text}，龙转属性值 = ${r2.total} ÷ ${f(r2.opt龙气.value)} = <b>${f(r2.dragonFlat, 3)}</b></div>

    <div style="color:#88ccff; margin:14px 0 6px;">二、物理部分</div>
    <div style="font-size:0.9em; color:#777;">物理面板 × 超会心 × 动作值 × 物理吸收</div>
    <div>非会心：${f(m.physPanel)} × 1 × ${f(FIXED.motion / 100, 4)} × ${f(m.physAbsorb)} = <b>${f(normal.physDmg)}</b></div>
    <div>会　心：${f(m.physPanel)} × ${f(crit.超会心倍率)} × ${f(FIXED.motion / 100, 4)} × ${f(m.physAbsorb)} = <b>${f(crit.physDmg)}</b></div>
    <div>负会心：${f(m.physPanel)} × ${f(NEG_CRIT_PHYS)} × ${f(FIXED.motion / 100, 4)} × ${f(m.physAbsorb)} = <b>${f(neg.physDmg)}</b></div>
    <div style="font-size:0.9em; color:#777;">超会心：${m.opt超会心.text}（倍率 ${f(m.opt超会心.value)}）</div>

    <div style="color:#88ccff; margin:14px 0 6px;">三、属性基础</div>
    <div style="font-size:0.9em; color:#777;">属贯自带 × 属性攻击力强化 × 奋斗 × 钢壳/炎鳞</div>
    <div>${f(FIXED.baseElem)} × ${f(m.opt属攻.value)} × ${f(m.opt奋斗.value)} × ${f(m.opt钢壳.value)} = <b>${f(m.elemBase, 3)}</b></div>
    <div style="font-size:0.9em; color:#777;">属性攻击力强化：${m.opt属攻.text}（倍率 ${f(m.opt属攻.value)}）</div>
    <div style="font-size:0.9em; color:#777;">奋斗：${m.opt奋斗.text}（倍率 ${f(m.opt奋斗.value)}）</div>
    <div style="font-size:0.9em; color:#777;">钢壳/炎鳞：${m.opt钢壳.text}（倍率 ${f(m.opt钢壳.value)}）</div>

    <div style="color:#88ccff; margin:14px 0 6px;">四、属性值合计</div>
    <div style="font-size:0.9em; color:#777;">自带 + 属攻加点 + 连击 + 伏魔 + 龙转 + 其他</div>
    <div>${f(m.elemBase, 3)} + ${f(m.elemAtkFlat)} + ${f(m.chainFlat)} + ${f(m.fumoFlat)} + ${f(m.dragonFlat, 3)} + ${f(m.otherFlat)} = <b>${f(m.elemTotal, 3)}</b></div>
    <div style="font-size:0.9em; color:#777;">属性攻击力强化：${m.opt属攻.text}（加点 +${m.opt属攻.flat || 0}）</div>
    <div style="font-size:0.9em; color:#777;">连击：${m.opt连击.text}（加点 +${m.opt连击.value}）</div>
    <div style="font-size:0.9em; color:#777;">伏魔耗命：${m.opt伏魔.text}（加点 +${m.opt伏魔.value}）</div>
    <div style="font-size:0.9em; color:#777;">其他：+${f(m.otherFlat, 2)}</div>

    <div style="color:#88ccff; margin:14px 0 6px;">五、属性伤害</div>
    <div style="font-size:0.9em; color:#777;">(属性值÷100) × 属痛 × 弱特 × 属会 × 笛子 × 属性吸收 × 物理面板</div>
    <div>非会心：(${f(m.elemTotal, 3)} ÷ 100) × ${f(m.属痛倍率)} × ${f(m.弱特倍率)} × 1 × ${f(m.笛子倍率)} × ${f(m.elemAbsorb)} × ${f(m.physPanel)} = <b>${f(normal.elemDmg)}</b></div>
    <div>会　心：(${f(m.elemTotal, 3)} ÷ 100) × ${f(m.属痛倍率)} × ${f(m.弱特倍率)} × ${f(crit.属会倍率)} × ${f(m.笛子倍率)} × ${f(m.elemAbsorb)} × ${f(m.physPanel)} = <b>${f(crit.elemDmg)}</b></div>
    <div>负会心：(${f(m.elemTotal, 3)} ÷ 100) × ${f(m.属痛倍率)} × ${f(m.弱特倍率)} × 1 × ${f(m.笛子倍率)} × ${f(m.elemAbsorb)} × ${f(m.physPanel)} = <b>${f(neg.elemDmg)}</b></div>
    <div style="font-size:0.9em; color:#777;">属痛龙珠：${m.opt属痛.text}（倍率 ${f(m.属痛倍率)}${m.opt属痛.key === '1' && m.elemAbsorb * 100 < 25 ? '，吸收不足25，未生效' : ''}）</div>
    <div style="font-size:0.9em; color:#777;">弱点特效【属性】：${m.opt弱特.text}（倍率 ${f(m.弱特倍率)}${m.opt弱特.key !== '0' && m.elemAbsorb * 100 < 20 ? '，吸收不足20，未生效' : ''}）</div>
    <div style="font-size:0.9em; color:#777;">会心击【属性】：${m.opt属会.text}（倍率 ${f(m.opt属会.value)}）</div>
    <div style="font-size:0.9em; color:#777;">笛子属性攻击力提升：${m.opt笛子.text}（倍率 ${f(m.opt笛子.value)}）</div>

    <div style="color:#88ccff; margin:14px 0 6px;">六、最终伤害</div>
    <div>非会心：${f(normal.physDmg)} + ${f(normal.elemDmg)} = <b style="color:#88ccff;">${f(normal.total)}</b></div>
    <div>会　心：${f(crit.physDmg)} + ${f(crit.elemDmg)} = <b style="color:#ffaa66;">${f(crit.total)}</b></div>
    <div>负会心：${f(neg.physDmg)} + ${f(neg.elemDmg)} = <b style="color:#ff6666;">${f(neg.total)}</b></div>

    <div style="color:#88ccff; margin:14px 0 6px;">七、期望伤害</div>
    <div>会心率：${f(critRateRaw)}%</div>
    ${critRate >= 0
      ? `<div>${f(normal.total)} × ${f(1 - critRate, 4)} + ${f(crit.total)} × ${f(critRate, 4)} = <b style="color:#ffcc66; font-size:1.15em;">${f(expected)}</b></div>`
      : `<div>${f(normal.total)} × ${f(1 - Math.abs(critRate), 4)} + ${f(neg.total)} × ${f(Math.abs(critRate), 4)} = <b style="color:#ffcc66; font-size:1.15em;">${f(expected)}</b></div>`
    }
  `;
}

document.querySelectorAll('input, select').forEach(el => {
  el.addEventListener('input', calc);
  el.addEventListener('change', calc);
});

document.getElementById('btnSave').addEventListener('click', () => {
  saveData();
  showToast('已保存');
});

document.getElementById('btnLoad').addEventListener('click', () => {
  const data = loadData();
  if (data) {
    applyData(data);
    showToast('已读取');
  } else {
    showToast('没有保存过数据');
  }
});

document.getElementById('btnReset').addEventListener('click', () => {
  if (confirm('重置为默认参考值？你保存的存档不会被删除，可以点读取恢复。')) {
    applyData(DEFAULTS);
    showToast('已重置为默认值');
  }
});

initSelects();
const saved = loadData();
applyData(saved || DEFAULTS);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
